[project]
name = "ai-test-review-backend"
version = "0.1.0"
description = "Retestify backend — AI-driven test case management: static analysis, an AI Review Engine (retain/modify/remove/generate), sandboxed test execution, and git-aware incremental re-analysis."
requires-python = ">=3.11"
keywords = ["testing", "ai", "llm", "static-analysis", "test-generation", "pytest", "ci-cd"]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "gitpython>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
ai = ["anthropic>=0.34", "openai>=1.30"]
eval = ["pyyaml>=6.0", "pandas>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
